<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>สแกนใบจัด · วินโมโตพาร์ท</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2933; --mute:#6b7280; --line:#e5e7eb; --pri:#1d4ed8; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); font-size:17px; }
  header { position:sticky; top:0; z-index:5; background:#111827; color:#fff; padding:10px 14px; display:flex; gap:10px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; }
  .seg { display:flex; background:#374151; border-radius:10px; overflow:hidden; }
  .seg button { border:0; background:none; color:#d1d5db; padding:8px 14px; font:inherit; font-weight:600; }
  .seg button.on { background:#fbbf24; color:#111827; }
  main { max-width:760px; margin:0 auto; padding:12px; }
  .box { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #reader { width:100%; border-radius:10px; overflow:hidden; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=text] { width:100%; font:inherit; font-size:18px; padding:12px; border:2px solid var(--line); border-radius:10px; }
  input[type=text]:focus { outline:none; border-color:var(--pri); }
  button.big { border:0; border-radius:12px; padding:16px 12px; font:inherit; font-size:19px; font-weight:700; color:#fff; background:var(--pri); width:100%; }
  button.ghost { border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .acts .main { grid-column:1 / -1; font-size:22px; padding:20px; }
  button.big.queue{background:#334155} button.big.front{background:#c2410c} button.big.take{background:var(--pri)} button.big.picked{background:#0e7490} button.big.packed{background:var(--ok)} button.big.ship{background:#7c3aed} button.big.short{background:var(--warn)} button.big.redo{background:var(--bad)}
  .q { font-size:56px; font-weight:700; line-height:1; }
  .bill { font-size:20px; font-weight:600; }
  .chip { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; font-size:16px; background:#e5e7eb; }
  .st-รอจัด,.st-ยังไม่เข้าระบบ{background:#fee2e2;color:#991b1b} .st-กำลังจัด{background:#dbeafe;color:#1e40af} .st-จัดเสร็จ{background:#cffafe;color:#155e75}
  .st-แพ็คแล้ว{background:#dcfce7;color:#166534} .st-ส่งแล้ว{background:#ede9fe;color:#5b21b6} .st-ของขาด,.st-จัดผิด{background:#fef3c7;color:#92400e}
  .meta { color:var(--mute); margin-top:6px; line-height:1.6; }
  .slow { color:var(--bad); font-weight:700; }
  h2 { font-size:17px; margin:0 0 8px; }
  .list { display:flex; flex-direction:column; gap:6px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; text-align:left; width:100%; }
  .item b { font-size:20px; margin-right:8px; }
  .item.late { border-color:var(--bad); background:#fef2f2; }
  .item.late .tl { color:var(--bad); font-weight:700; }
  .acts .two { grid-column:auto; font-size:21px; padding:22px 8px; }
  .ty { display:inline-block; padding:3px 10px; border-radius:8px; font-weight:700; font-size:15px; margin-right:6px; }
  .ty1{background:#fee2e2;color:#991b1b} .ty2{background:#ffedd5;color:#9a3412} .ty3{background:#fef9c3;color:#854d0e} .ty4{background:#dbeafe;color:#1e40af} .ty5{background:#ede9fe;color:#5b21b6} .ty6{background:#f3f4f6;color:#4b5563}
  .tl { color:var(--mute); font-size:14px; }
  @keyframes blink { 50% { opacity:.45 } } .item.late.lv1 { animation:blink 1.2s infinite; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .modal.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:760px; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px; }
  .names { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:10px 0; }
  .names button { border:2px solid var(--line); background:#fff; border-radius:12px; padding:14px 6px; font:inherit; font-size:18px; font-weight:600; }
  .names button.last { border-color:var(--pri); background:#eff6ff; }
  .names .g { grid-column:1 / -1; color:var(--mute); font-size:14px; margin-top:6px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .opts button { border:2px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; }
  .opts button.on { border-color:var(--pri); background:#eff6ff; color:var(--pri); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; padding:12px 20px; border-radius:12px; font-weight:600; display:none; z-index:20; max-width:90%; text-align:center; }
  #toast.err { background:var(--bad); }
  .hint { color:var(--mute); font-size:14px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .tile { border:2px solid #bbf7d0; background:#f0fdf4; border-radius:12px; padding:10px 6px; text-align:center; font:inherit; }
  .tile b { display:block; font-size:30px; line-height:1.1; color:#166534; }
  .tile span { display:block; font-size:13px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.old { border-color:#fca5a5; background:#fef2f2; }
  .warnbox { background:#fef3c7; border:2px solid #f59e0b; border-radius:12px; padding:12px; white-space:pre-line; font-weight:600; }
  button.big.recv { background:var(--ok); }
  .cust { font-size:18px; font-weight:700; margin-top:4px; }
  .who { border:0; background:#374151; color:#fff; border-radius:10px; padding:8px 10px; font:inherit; font-size:14px; font-weight:600; white-space:nowrap; }
  button.big.next { background:#1d4ed8; font-size:24px; padding:22px; }
  button.big.heavy { background:#78350f; }
  .hv { display:inline-block; background:#fef3c7; color:#78350f; border-radius:8px; padding:2px 8px; font-weight:700; font-size:14px; margin-right:6px; }
  .toggle { border:2px solid var(--line); background:#fff; border-radius:12px; padding:12px; font:inherit; font-weight:700; width:100%; margin-top:10px; }
  .toggle.on { border-color:#b45309; background:#fef3c7; color:#78350f; }
  .goto { text-align:center; padding:6px 0 2px; } .goto b { font-size:72px; line-height:1; display:block; }
</style>
</head>
<body>
<header>
  <h1>📦 สแกนใบจัด</h1>
  <button class="who" id="whoBtn">👤</button>
  <div class="seg"><button id="stFront">หน้าร้าน</button><button id="stBack">หลังร้าน</button></div>
</header>
<main>
  <div class="box">
    <div id="reader"></div>
    <div class="row" id="camTools" style="display:none;margin-top:8px;flex-wrap:wrap">
      <button class="ghost" id="zoomBtn" style="display:none">🔍 ซูม 1x</button>
      <button class="ghost" id="torchBtn" style="display:none">🔦 ไฟฉาย</button>
      <span class="hint">ถือห่าง 15–20 ซม. ให้ QR เต็มกรอบ ถือนิ่ง 1–2 วินาที</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="camBtn">📷 เปิดกล้อง</button>
      <input type="text" id="manual" placeholder="ยิงบาร์โค้ด / พิมพ์ท้ายเลขบิล แล้วกด Enter" autocomplete="off" inputmode="search">
    </div>
    <div class="hint" style="margin-top:6px">เครื่องยิง 2D: ยิงได้เลย ไม่ต้องแตะช่อง · บิลใหม่ที่เครื่องยิงอ่านภาษาไทยไม่ได้ ใช้ 📷 กล้อง</div>
  </div>

  <div class="box" id="card" style="display:none"></div>

  <div class="box" id="nextBox" style="display:none"><button class="big next" id="nextBtn">▶️ รับบิลถัดไป</button>
    <div class="hint" style="margin-top:6px;text-align:center">ระบบเลือกบิลให้ตามลำดับความด่วน · บิล 💪 ไปหาคนยกของหนักได้</div></div>

  <div class="box" id="readyBox" style="display:none"><h2>✅ พร้อมรับสินค้า <span class="hint">แตะเลขคิวตอนส่งของให้ลูกค้า</span></h2><div class="tiles" id="ready"></div></div>

  <div class="box"><h2 id="boardTitle">รายการค้าง</h2><div class="list" id="board"></div></div>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
// ====== ตั้งค่า (แก้ 2 บรรทัดนี้) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwSApgfF0Xwd7N7d7OXpuo1vmt2bUrnCDIk5pk47I2JytdtNDcJjlM8euroAZUXN7AJJQ/exec';
const KEY = 'win-pick-2569';   // ต้องตรงกับ PICK_KEY ในโค้ดบอท
// =====================================

const LABEL = { undo:'↩️ กดผิด ย้อนกลับเข้าคิว', next:'▶️ รับบิลถัดไป', heavy:'💪 ของหนัก ส่งต่อ', queue:'📥 ส่งเข้าคิวจัด', front:'🏁 จบที่หน้าร้าน', take:'▶️ รับจัด', picked:'✅ จัดเสร็จ', packed:'📦 แพ็คแล้ว', ship:'🚚 ส่งแล้ว', short:'⚠️ ของขาด', redo:'🔁 จัดผิด' };
const METHODS = ['รถร้าน', 'ขนส่ง', 'รถประจำทาง', 'รับเอง'];
const CARRIERS = ['KERRY', 'FLASH', 'J&T', 'ไปรษณีย์ไทย', 'SPX', 'เจ้สั้น', 'รถตู้', 'รถบัส', 'อื่นๆ'];
const PKGS = ['1 กล่อง', '2 กล่อง', '3 กล่อง', '1 ถุง', '1 กระสอบ', '1 มัด'];
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let station = store.get('station', 'front'), staff = [], current = null, lastCode = '', lastAt = 0, cam = null, board = [], slowMin = 15;

const $ = id => document.getElementById(id);
function toast(t, err) { const el = $('toast'); el.textContent = t; el.className = err ? 'err' : ''; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', err ? 3500 : 2000); }
function beep(ok) { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(a.destination); g.gain.value = .15; o.start(); setTimeout(() => { o.stop(); a.close(); }, 130); } catch (e) {} }
function mins(t) { return t ? Math.floor((Date.now() - t) / 60000) : null; }
function hm(t) { if (!t) return ''; const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function tyBadge(b) { const t = b.type; return (b.heavy ? '<span class="hv">💪</span>' : '') + (t ? '<span class="ty ty' + t.lvl + '">' + t.icon + ' ' + esc(t.label) + '</span>' : ''); }
// ---------- เครื่องนี้ของใคร: 'me:<uid>' = มือถือส่วนตัว (ไม่ต้องแตะชื่อ) · 'shared' = เครื่องกลาง (แตะชื่อทุกครั้ง) ----------
function myUid() { const d = store.get('dev', ''); return d.indexOf('me:') === 0 ? d.slice(3) : ''; }
function me() { return staff.find(s => s.uid === myUid()); }
function renderWho() { const m = me(); $('whoBtn').textContent = m ? '👤 ' + m.name : store.get('dev', '') === 'shared' ? '👥 เครื่องกลาง' : '👤 ตั้งค่า'; }
function openDevice() {
  $('sheet').innerHTML = '<div class="row" style="justify-content:space-between"><h2 style="margin:0">เครื่องนี้ใช้ยังไง?</h2><button class="ghost" id="xBtn">✕</button></div>' +
    '<button class="big" id="devShared" style="margin-top:12px;background:#374151">👥 เครื่องกลาง (หลายคนใช้ · แตะชื่อทุกครั้ง)</button>' +
    '<h2 style="margin-top:16px">หรือ มือถือของฉัน — ฉันคือ…</h2><div class="names">' +
    staff.map(s => '<button data-me="' + s.uid + '"' + (s.uid === myUid() ? ' class="last"' : '') + '>' + esc(s.name) + (s.heavy ? ' 💪' : '') + '</button>').join('') + '</div>' +
    '<div class="hint">มือถือส่วนตัว: กดปุ่มแล้วบันทึกเป็นชื่อนี้ทันที ไม่ต้องแตะชื่อ · ห้ามให้คนอื่นใช้แทน</div>';
  $('modal').classList.add('show'); $('xBtn').onclick = closeModal;
  $('devShared').onclick = () => { store.set('dev', 'shared'); renderWho(); closeModal(); toast('ตั้งเป็นเครื่องกลางแล้ว'); };
  $('sheet').querySelectorAll('[data-me]').forEach(el => el.onclick = () => { store.set('dev', 'me:' + el.dataset.me); renderWho(); closeModal(); toast('เครื่องนี้เป็นของ ' + me().name); });
}
$('whoBtn').onclick = () => openDevice();
let heavyFlag = false, simple = false;
// เกินเวลาไหม: ด่วน/ช่าง/ส่งใกล้ = รอเกิน X นาที (ยังไม่แพ็ค) · รถร้าน/ขนส่ง = เลยเวลาที่ต้องแพ็คเสร็จ
function lateInfo(b) {
  const a = b.alert || {}, done = ['แพ็คแล้ว', 'ส่งแล้ว', 'ยกเลิก'].includes(b.status);
  if (a.mode === 'wait') { const m = mins(b.created); return { late: !done && m !== null && m >= a.min, text: done || m === null ? '' : 'รอ ' + m + ' นาที' }; }
  if (a.mode === 'due') return { late: !done && Date.now() >= a.at, text: done ? '' : 'แพ็คก่อน ' + hm(a.at) + (a.note ? ' (' + a.note + ')' : '') };
  return { late: false, text: a.note || '' };
}
function lbl(a, b) {
  if (a === 'ship' && b && b.method === 'รับเอง') return '✅ ลูกค้ารับแล้ว';
  if (a === 'front' && b && b.picker && ['จัดเสร็จ', 'กำลังจัด'].includes(b.status)) return '✅ เช็คแล้ว ส่งมอบลูกค้า';
  return LABEL[a];
}
// เลขที่แสดงแทนเลขคิว: 4 ตัวท้ายของเลขที่บิล (SO6911-003824 → 3824)
function qLabel(b) { return String((b && b.bill) || '').replace(/\D/g, '').slice(-4); }
function shortBill(b) { return String(b || '').replace(/^SO\d{4}-0*/, ''); }

async function api(params) {
  if (/ตรงนี้/.test(API_URL)) { toast('ยังไม่ได้ใส่ลิงก์ API_URL ใน pick.html', true); throw new Error('no url'); }
  const q = new URLSearchParams(Object.assign({ key: KEY }, params));
  const res = await fetch(API_URL + '?' + q.toString());
  return res.json();
}

function setStation(s) {
  station = s; store.set('station', s);
  $('stFront').className = s === 'front' ? 'on' : ''; $('stBack').className = s === 'back' ? 'on' : '';
  $('boardTitle').textContent = s === 'front' ? 'รอจัด / กำลังจัด' : 'รอเช็ค · แพ็คแล้วรอส่ง';
  renderBoard(); if (current) renderCard(current);
}
$('stFront').onclick = () => setStation('front');
$('stBack').onclick = () => setStation('back');

// ---------- สแกน ----------
// src: 'cam' = กล้อง (อ่านภาษาไทยได้ครบ) · 'kb' = เครื่องยิง/พิมพ์ (ภาษาไทยหายหรือมั่ว)
async function onCode(code, src) {
  code = String(code || '').trim();
  if (!code) return;
  if (src === 'kb' && /[\u0E00-\u0E7F]/.test(code) && /^[A-Za-z]{1,5}\d/.test(code)) return;   // บรรทัดภาษาไทยมั่วที่เครื่องยิงพิมพ์แยกมา (คีย์บอร์ดไทย) — ไม่ใช่เลขบิล
  // เครื่องยิง: ช่อง "ขนส่งโดย" ภาษาไทยหายไป (เหลือ "…|84|6|") → ห้ามใช้กับบิลใหม่ ไม่งั้นระบบเข้าใจเป็นบิลปลีก
  const kbLost = src === 'kb' && code.split('|').length >= 4 && !code.split('|')[3].trim();
  if (code === lastCode && Date.now() - lastAt < 4000) return;   // กันสแกนซ้ำรัวๆ
  lastCode = code; lastAt = Date.now();
  beep(true);
  $('card').style.display = 'block'; $('card').innerHTML = '<div class="hint">กำลังค้นหา…</div>';
  try {
    const r = await api({ api: 'bill', q: code });
    if (!r.ok && r.garbled) { beep(false); showGarbled(r.err); return; }
    if (!r.ok) { beep(false); toast(r.err, true); $('card').style.display = 'none'; return; }
    if (r.isNew && kbLost) { beep(false); showGarbled('⚠️ เครื่องยิงอ่านภาษาไทยในใบจัดไม่ได้ (ประเภทขนส่ง)\nบิลใหม่ให้สแกนครั้งแรกด้วย 📷 กล้อง · ครั้งต่อไปใช้เครื่องยิงได้ตามปกติ'); return; }
    current = Object.assign(r.bill, { code: code, isNew: !!r.isNew });
    renderCard(current);
  } catch (e) { if (e.message !== 'no url') toast('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต', true); }
}
$('manual').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; onCode(v, 'kb'); } });

// เครื่องยิงบลูทูธอ่านภาษาไทยไม่ได้ → บิลใหม่ให้ใช้กล้อง
function showGarbled(msg) {
  $('card').style.display = 'block';
  $('card').innerHTML = '<div class="warnbox">' + esc(msg) + '</div>' + (cam ? '<div class="hint" style="margin-top:8px">กล้องเปิดอยู่แล้ว ส่องใบจัดได้เลย</div>' : '<button class="big" id="gCam" style="margin-top:10px">📷 เปิดกล้องสแกนบิลนี้</button>');
  if ($('gCam')) $('gCam').onclick = () => { toggleCam(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  lastCode = '';
}
// กล้อง (v10.8.3): QR ใบจัดแน่นขึ้นหลังเพิ่มชื่อลูกค้า → ความละเอียดสูง + โฟกัสต่อเนื่อง + อ่านทั้งภาพ + ตัวอ่าน QR ในเครื่อง (Android) + ซูม/ไฟฉาย
let camZoom = 1, camTorch = false, camCaps = {};
async function toggleCam() {
  if (cam) { await cam.stop().catch(() => {}); cam = null; $('camBtn').textContent = '📷 เปิดกล้อง'; $('reader').innerHTML = ''; $('camTools').style.display = 'none'; return; }
  const opts = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
  try { if (window.Html5QrcodeSupportedFormats) opts.formatsToSupport = [Html5QrcodeSupportedFormats.QR_CODE]; } catch (e) {}
  cam = new Html5Qrcode('reader', opts);
  const cfg = {
    fps: 15,
    // ไม่กำหนด qrbox = อ่านทั้งภาพ (ทดสอบแล้วอ่าน QR แน่นได้ดีกว่ากรอบ)
    disableFlip: true,
    videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] },
  };
  try {
    try { await cam.start({ facingMode: 'environment' }, cfg, txt => onCode(txt, 'cam'), () => {}); }
    catch (e1) {   // บางเครื่องไม่รับค่าความละเอียดสูง → ลองแบบพื้นฐาน
      delete cfg.videoConstraints; await cam.start({ facingMode: 'environment' }, cfg, txt => onCode(txt, 'cam'), () => {});
    }
    $('camBtn').textContent = '⏹ ปิดกล้อง'; store.set('cam', '1');
    camZoom = 1; camTorch = false; camCaps = {};
    try { camCaps = cam.getRunningTrackCapabilities() || {}; } catch (e) {}
    $('camTools').style.display = 'flex';
    $('zoomBtn').style.display = camCaps.zoom ? '' : 'none';
    $('torchBtn').style.display = camCaps.torch ? '' : 'none';
    $('zoomBtn').textContent = '🔍 ซูม 1x'; $('torchBtn').textContent = '🔦 ไฟฉาย';
  } catch (e) { cam = null; toast('เปิดกล้องไม่ได้: อนุญาตกล้องในเบราว์เซอร์ก่อน', true); }
}
// ซูม: 1x → 2x → 3x (เท่าที่กล้องรองรับ) — QR เล็กหรือแน่น ซูม 2x แล้วถือห่างขึ้น อ่านง่ายกว่าจ่อใกล้
$('zoomBtn').onclick = async () => {
  if (!cam || !camCaps.zoom) return;
  const max = camCaps.zoom.max || 1, min = camCaps.zoom.min || 1;
  camZoom = camZoom >= Math.min(3, max) ? min : Math.min(camZoom + 1, max);
  try { await cam.applyVideoConstraints({ advanced: [{ zoom: camZoom }] }); $('zoomBtn').textContent = '🔍 ซูม ' + camZoom + 'x'; } catch (e) { toast('ซูมไม่ได้บนเครื่องนี้', true); }
};
$('torchBtn').onclick = async () => {
  if (!cam || !camCaps.torch) return;
  camTorch = !camTorch;
  try { await cam.applyVideoConstraints({ advanced: [{ torch: camTorch }] }); $('torchBtn').textContent = camTorch ? '🔦 ปิดไฟ' : '🔦 ไฟฉาย'; } catch (e) { toast('เปิดไฟฉายไม่ได้บนเครื่องนี้', true); }
};
$('camBtn').onclick = toggleCam;

// ---------- การ์ดบิล ----------
function renderCard(b) {
  const late = b.taken && !b.picked && mins(b.taken) >= slowMin, li = lateInfo(b);
  const order = station !== 'front' ? ['picked', 'packed', 'ship', 'redo', 'short', 'take']
    : b.status === 'จัดเสร็จ' ? ['front', 'packed', 'redo']                              // ลูกค้ารีบ: หน้าร้านเช็คเองแล้วส่งมอบ
    : (b.acts || []).includes('queue') ? ['queue', 'front']                             // บิลใหม่: หน้าร้านเลือกแค่ เข้าคิว / จบหน้าร้าน (กันกดจัดเสร็จผิด)
    : ['take', 'picked', 'short', 'packed', 'front', 'heavy'];                          // คนจัด: ปุ่มหลักคือ รับจัด / จัดเสร็จ
  const acts = order.filter(a => (b.acts || []).includes(a));
  if (station === 'front' && (b.acts || []).includes('ship') && !acts.includes('ship')) acts.unshift('ship');
  const pair = acts[0] === 'queue' && acts[1] === 'front';   // หน้าร้าน: 2 ปุ่มใหญ่คู่กัน ให้พนักงานขายเลือก
  // หน้าร้าน + ลูกค้ามารับเอง: ปุ่มเดียวจบ ใช้ชื่อคนกดล่าสุด
  const quickUid = station === 'front' && acts[0] === 'ship' && b.method === 'รับเอง' ? store.get('last_front_ship', '') : '';
  const quickS = staff.find(s => s.uid === quickUid);
  $('card').innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
      '<div><div class="q">' + esc(qLabel(b)) + '</div><div class="bill">' + esc(b.bill) + (b.items ? ' · ' + esc(b.items) + ' รายการ' : '') + '</div>' + (b.cust ? '<div class="cust">👤 ' + esc(b.cust) + '</div>' : '') + '</div>' +
      '<span class="chip st-' + esc(b.status) + '">' + esc(b.status) + '</span></div>' +
    '<div style="margin-top:8px">' + tyBadge(b) + (li.text ? '<span class="' + (li.late ? 'slow' : 'tl') + '">' + (li.late ? '⏰ ' : '') + esc(li.text) + '</span>' : '') + '</div>' +
    '<div class="meta">' +
      (b.picker ? '👷 จัด: <b>' + esc(b.picker) + '</b>' + (b.taken ? ' · รับ ' + hm(b.taken) : '') + (b.picked ? ' · เสร็จ ' + hm(b.picked) : (b.taken ? ' · <span class="' + (late ? 'slow' : '') + '">' + mins(b.taken) + ' นาที</span>' : '')) + '<br>' : '') +
      (b.checker ? '✔️ เช็ค/แพ็ค: <b>' + esc(b.checker) + '</b> ' + hm(b.packed) + (b.pkg ? ' · ' + esc(b.pkg) : '') + '<br>' : '') +
      (b.method ? '🚚 ' + esc(b.method) + '<br>' : '') + (b.errors ? '🔁 จัดผิด ' + b.errors + ' ครั้ง<br>' : '') + (b.note ? '💬 ' + esc(b.note) : '') +
    '</div>' +
    (quickS ? '<div class="acts"><button class="big recv main" id="quick">✅ ลูกค้ารับแล้ว<br><span style="font-size:15px;font-weight:600">โดย ⭐ ' + esc(quickS.name) + '</span></button>' +
      '<button class="ghost" id="quickOther" style="grid-column:1/-1">เปลี่ยนชื่อคนส่งของ</button></div>' :
     acts.length ? '<div class="acts">' + acts.map((a, i) => '<button class="big ' + a + (a === 'ship' && b.method === 'รับเอง' ? ' recv' : '') + (pair && i < 2 ? ' two' : i === 0 ? ' main' : '') + '" data-a="' + a + '">' + lbl(a, b) + '</button>').join('') + '</div>'
      : '<div class="meta">✅ บิลนี้ปิดแล้ว</div>');
  if (station === 'front' && (b.acts || []).includes('queue')) {   // ติดป้ายของหนักตอนส่งเข้าคิว
    heavyFlag = false;
    const t = document.createElement('button'); t.className = 'toggle'; t.id = 'hvTog'; t.textContent = '💪 บิลนี้มีของหนัก (แตะก่อนกดส่งเข้าคิว)';
    t.onclick = () => { heavyFlag = !heavyFlag; t.classList.toggle('on', heavyFlag); t.textContent = heavyFlag ? '💪 ของหนัก ✓ (แตะอีกครั้งเพื่อยกเลิก)' : '💪 บิลนี้มีของหนัก (แตะก่อนกดส่งเข้าคิว)'; };
    $('card').appendChild(t);
  }
  $('card').querySelectorAll('[data-a]').forEach(el => el.onclick = () => el.dataset.a === 'queue' ? submit('queue', '') : openAction(el.dataset.a));
  if (b.undo) {
    const u = document.createElement('button'); u.className = 'ghost'; u.style.cssText = 'width:100%;margin-top:10px;color:#b91c1c';
    u.textContent = LABEL.undo; u.onclick = () => { if (confirm('ย้อนบิล ' + (qLabel(b)) + ' กลับเป็น "รอจัด"?\n(ล้างชื่อคนจัด/เช็ค/ส่ง ของบิลนี้)')) openAction('undo'); };
    $('card').appendChild(u);
  }
  if ($('quick')) { $('quick').onclick = () => submit('ship', quickS.uid, false, true); $('quickOther').onclick = () => openAction('ship'); }
}

// ---------- เลือกชื่อ + ข้อมูลเพิ่ม ----------
function openAction(a) {
  const mine = me();
  const needInput = ['short', 'redo'].includes(a) || (a === 'packed' && !simple) || (a === 'ship' && !(current && current.method === 'รับเอง'));
  if (mine && !needInput) {   // มือถือส่วนตัว: กดแล้วบันทึกเลย (ขั้นที่ปิดงาน ถามยืนยันก่อน)
    if (['picked', 'front', 'ship'].includes(a) && !confirm('ยืนยัน: ' + mine.name + ' · ' + lbl(a, current).replace(/^\S+\s/, '') + ' · บิล ' + (qLabel(current)) + ' ?')) return;
    return submit(a, mine.uid, false, a === 'ship');
  }
  const prefer = station === 'front' ? /จัด/ : /เช็ค|แพ็ค/;
  const groups = {};
  staff.forEach(s => (groups[s.grp || 'อื่นๆ'] = groups[s.grp || 'อื่นๆ'] || []).push(s));
  const gNames = Object.keys(groups).sort((x, y) => (prefer.test(y) ? 1 : 0) - (prefer.test(x) ? 1 : 0));
  const lastUid = store.get('last_' + station + '_' + a, store.get('last_' + station, ''));
  const lastS = staff.find(s => s.uid === lastUid);
  let extra = '';
  if (a === 'packed' && simple) extra = '<div class="meta" style="margin-top:8px">📦 แพ็คเสร็จ = จบงานบิลนี้ (โหมดง่าย)</div>';
  else if (a === 'packed') extra = '<h2>จำนวนหีบห่อ</h2><div class="opts" id="pkgOpts">' + PKGS.map(p => '<button>' + p + '</button>').join('') + '</div>' +
    '<input type="text" id="pkgIn" placeholder="หรือพิมพ์ เช่น 2 กล่อง 1 กระสอบ">';
  if (a === 'ship') {
    const needC = /ขนส่ง|ประจำทาง/.test(current.method || ''), cs = CARRIERS.slice();
    if (current.carrier && !cs.some(c => c.toLowerCase() === current.carrier.toLowerCase()) && /ขนส่ง|ประจำทาง/.test(current.method)) cs.unshift(current.carrier);
    extra = '<h2>วิธีส่ง' + (current.type ? ' <span class="hint">(ตั้งให้จาก "' + esc(current.type.ship || current.type.label) + '")</span>' : '') + '</h2><div class="opts" id="mOpts">' +
      METHODS.map(m => '<button' + (m === current.method ? ' class="on"' : '') + '>' + m + '</button>').join('') + '</div>' +
      '<div id="shipMore" style="display:' + (needC ? 'block' : 'none') + '"><div class="opts" id="cOpts">' +
      cs.map(c => '<button' + (current.carrier && c.toLowerCase() === current.carrier.toLowerCase() ? ' class="on"' : '') + '>' + esc(c) + '</button>').join('') +
      '</div><input type="text" id="trackIn" placeholder="เลขพัสดุ (ถ้ามี)"></div>';
  }
  if (a === 'front') extra = '<div class="meta" style="margin-top:8px">🏁 บันทึกว่า <b>คนที่แตะชื่อ</b> จัด เช็ค และส่งมอบลูกค้าเองที่หน้าร้าน บิลนี้ปิดเลย ไม่ต้องผ่านหลังร้าน</div>';
  if (a === 'short' || a === 'redo') extra = '<h2>' + (a === 'short' ? 'ขาดอะไร' : 'ผิดอะไร') + '</h2><input type="text" id="noteIn" placeholder="' + (a === 'short' ? 'รหัส/ชื่อสินค้าที่ขาด' : 'เช่น หยิบผิดรุ่น 10011') + '">';
  $('sheet').innerHTML = '<div class="row" style="justify-content:space-between"><h2 style="margin:0">' + lbl(a, current) + (current ? ' · บิล ' + esc(qLabel(current)) : '') + '</h2><button class="ghost" id="xBtn">✕</button></div>' +
    extra + (mine ? '<button class="big" data-u="' + mine.uid + '" style="margin-top:14px">💾 บันทึก (' + esc(mine.name) + ')</button>' :
    '<h2 style="margin-top:12px">ใครทำ? (แตะชื่อเพื่อบันทึก)</h2><div class="names">' +
    (lastS ? '<button class="last" data-u="' + lastS.uid + '">⭐ ' + esc(lastS.name) + '</button>' : '') +
    gNames.map(g => '<div class="g">' + esc(g) + '</div>' + groups[g].map(s => '<button data-u="' + s.uid + '">' + esc(s.name) + (s.heavy ? ' 💪' : '') + '</button>').join('')).join('') + '</div>');
  $('modal').classList.add('show');
  $('xBtn').onclick = closeModal;
  const pick = (box, inp) => box && box.querySelectorAll('button').forEach(btn => btn.onclick = () => {
    box.querySelectorAll('button').forEach(x => x.classList.remove('on')); btn.classList.add('on'); if (inp) inp.value = btn.textContent;
    if (box.id === 'mOpts') $('shipMore').style.display = /ขนส่ง|ประจำทาง/.test(btn.textContent) ? 'block' : 'none';
  });
  pick($('pkgOpts'), $('pkgIn')); pick($('mOpts')); pick($('cOpts'));
  $('sheet').querySelectorAll('[data-u]').forEach(el => el.onclick = () => submit(a, el.dataset.u));
}
function closeModal() { $('modal').classList.remove('show'); setTimeout(() => $('manual').focus(), 100); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

let busy = false;   // กันกดซ้ำระหว่างรอระบบตอบ (กดรัวทำให้ระบบคิวยาวขึ้น)
async function submit(a, uid, force, quick, retry) {
  if (busy && !retry) return toast('กำลังบันทึก… รอสักครู่');
  const p = { api: 'act', q: a === 'next' ? '' : current.code || current.bill, a: a, uid: uid };
  if (a === 'queue' && heavyFlag) p.heavy = '1';
  if (a === 'packed') p.pkg = ($('pkgIn') || {}).value || '';
  if (a === 'ship' && !quick) {
    const m = document.querySelector('#mOpts .on'); if (!m) return toast('เลือกวิธีส่งก่อน', true);
    p.method = m.textContent; const c = document.querySelector('#cOpts .on'); if (c && /ขนส่ง|ประจำทาง/.test(p.method)) p.carrier = c.textContent;
    p.track = ($('trackIn') || {}).value || '';
  }
  if (a === 'short' || a === 'redo') { p.note = ($('noteIn') || {}).value || ''; if (!p.note.trim()) return toast('พิมพ์รายละเอียดก่อน', true); }
  if (force) p.force = '1';
  busy = true; document.body.style.cursor = 'progress';
  try {
    const r = await api(p);
    if (!r.ok && r.busy) {   // คนกดพร้อมกันเยอะ: ลองใหม่เองอีก 1 ครั้ง
      if (!retry) { toast('⏳ ระบบไม่ว่าง กำลังลองใหม่…'); await new Promise(z => setTimeout(z, 2000)); busy = false; return submit(a, uid, force, quick, true); }
      beep(false); return toast(r.err, true);
    }
    if (!r.ok && r.confirm) { if (confirm(r.err)) { busy = false; return submit(a, uid, true, quick, true); } return; }
    if (!r.ok && r.empty) { closeModal(); return toast(r.err); }
    if (!r.ok && r.garbled) { beep(false); closeModal(); return showGarbled(r.err); }
    if (!r.ok) { beep(false); return toast(r.err, true); }
    if (a === 'queue') {
      beep(true); toast((r.already ? 'อยู่ในคิวแล้ว' : '📥 เข้าคิวจัดแล้ว') + ' · บิล ' + (qLabel(r.bill)) + ' ' + (r.bill.type ? r.bill.type.icon + ' ' + r.bill.type.label : ''));
      $('card').style.display = 'none'; current = null; loadBoard(); $('manual').focus(); return;
    }
    store.set('last_' + station + '_' + a, uid); store.set('last_' + station, uid);
    const who = (staff.find(s => s.uid === uid) || {}).name || '';
    beep(true); toast(lbl(a, current).replace(/^\S+\s/, '') + ' · บิล ' + (qLabel(r.bill)) + ' · ' + who);
    current = Object.assign(r.bill, { code: current ? current.code : r.bill.bill }); renderCard(current); closeModal(); loadBoard();
    if (a === 'next') {   // บอกให้ไปหยิบใบไหน
      $('card').style.display = 'block';
      $('card').insertAdjacentHTML('afterbegin', '<div class="goto">ไปหยิบใบจัด<b>บิล ' + esc(qLabel(r.bill)) + '</b>' + (r.bill.cust ? esc(r.bill.cust) + ' · ' : '') + esc(r.bill.items ? r.bill.items + ' รายการ' : '') + '</div>');
      window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    setTimeout(() => { if (current && current.bill === r.bill.bill) { $('card').style.display = 'none'; current = null; } }, 6000);
  } catch (e) { if (e.message !== 'no url') toast('บันทึกไม่สำเร็จ ลองอีกครั้ง', true); }
  finally { busy = false; document.body.style.cursor = ''; }
}

// ---------- รายการค้าง ----------
async function loadBoard() {
  try { const r = await api({ api: 'board' }); if (r.ok) { board = r.board; slowMin = r.slow || 15; simple = !!r.simple; renderBoard(); } } catch (e) {}
}
function renderBoard() {
  const want = station === 'front' ? ['รอจัด', 'จัดผิด', 'ของขาด', 'กำลังจัด'] : ['จัดเสร็จ', 'กำลังจัด', 'แพ็คแล้ว', 'จัดผิด', 'ของขาด'];
  // เรียง: เกินเวลาก่อน → ความด่วน (ปลีก > ช่าง > ส่งใกล้ > รถร้าน > ขนส่ง > มารับภายหลัง) → เข้าคิวก่อน
  const lv = b => b.type ? b.type.lvl : 9;
  const list = board.filter(b => want.includes(b.status)).map(b => Object.assign(b, { li: lateInfo(b) }))
    .sort((x, y) => (y.li.late - x.li.late) || lv(x) - lv(y) || (x.created || 0) - (y.created || 0));
  $('board').innerHTML = list.length ? list.map(b => {
    const slow = b.status === 'กำลังจัด' && mins(b.taken) >= slowMin, late = b.li.late || slow;
    return '<button class="item' + (late ? ' late lv' + lv(b) : '') + '" data-b="' + esc(b.bill) + '"><span><b>' + esc(qLabel(b)) + '</b>' + tyBadge(b) + esc(b.picker || '') + (b.cust ? ' <span class="tl">👤 ' + esc(b.cust) + '</span>' : '') +
      (b.status === 'กำลังจัด' && b.taken ? ' · จัด ' + mins(b.taken) + ' นาที' : '') + (b.li.text ? '<br><span class="tl">' + (b.li.late ? '⏰ ' : '') + esc(b.li.text) + '</span>' : '') +
      '</span><span class="chip st-' + esc(b.status) + '">' + esc(b.status) + '</span></button>';
  }).join('') : '<div class="hint">ไม่มีรายการค้าง 🎉</div>';
  // หน้าร้าน: บิลแพ็คแล้ว รอส่งมอบ (ลูกค้ามารับเองขึ้นก่อน)
  // + บิลรอรับที่จัดเสร็จแล้วแต่ยังไม่เช็ค (ลูกค้ารีบ หน้าร้านเช็คเองได้)
  const waitChk = board.filter(b => b.status === 'จัดเสร็จ' && (b.acts || []).includes('front')).sort((x, y) => (x.picked || 0) - (y.picked || 0));
  const ready = waitChk.concat(board.filter(b => b.status === 'แพ็คแล้ว').sort((x, y) => ((y.method === 'รับเอง') - (x.method === 'รับเอง')) || (x.packed || 0) - (y.packed || 0)));
  $('readyBox').style.display = station === 'front' ? 'block' : 'none';
  $('nextBox').style.display = station === 'front' ? 'block' : 'none';
  $('ready').innerHTML = ready.length ? ready.map(b => '<button class="tile' + (mins(b.packed) >= 30 ? ' old' : '') + '" data-b="' + esc(b.bill) + '"><b>' + esc(qLabel(b)) + '</b>' +
    '<span>' + (b.cust ? esc(b.cust) : (b.type ? b.type.icon + ' ' + esc(b.type.label) : '')) + '</span><span>' + (b.status === 'จัดเสร็จ' ? '🔍 รอเช็ค · จัด ' + hm(b.picked) : 'แพ็ค ' + hm(b.packed)) + '</span></button>').join('') : '<div class="hint">ยังไม่มีบิลพร้อมรับ</div>';
  document.querySelectorAll('#board [data-b], #ready [data-b]').forEach(el => el.onclick = () => { lastCode = ''; onCode(el.dataset.b); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

// ---------- เครื่องยิงบลูทูธ: รับการยิงได้ตลอด ไม่ต้องแตะช่องก่อน (iPad) ----------
let kb = '', kbT = 0;
document.addEventListener('keyup', e => { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') e.preventDefault(); });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); }, 0); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;          // กำลังพิมพ์ในช่องอื่นอยู่
  if (t && t.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) e.preventDefault();   // กันเครื่องยิงไปกดปุ่มที่ค้างโฟกัส
  if (e.key === 'Enter') { const v = kb; kb = ''; if (v.length >= 4) { e.preventDefault(); if ($('modal').classList.contains('show')) closeModal(); onCode(v, 'kb'); } return; }
  if (e.key && e.key.length === 1) { if (Date.now() - kbT > 300) kb = ''; kb += e.key; kbT = Date.now(); }
});

// ---------- เริ่ม ----------
$('nextBtn').onclick = () => { current = null; openAction('next'); };

(async function init() {
  setStation(station);
  try { const r = await api({ api: 'staff' }); if (r.ok) staff = r.staff; else toast(r.err, true); } catch (e) {}
  renderWho(); if (!store.get('dev', '') && staff.length) openDevice();   // ครั้งแรก: ถามว่าเครื่องนี้ของใคร
  loadBoard(); setInterval(loadBoard, 20000);
  if (store.get('cam', '') === '1') toggleCam();
  $('manual').focus();
})();
</script>
